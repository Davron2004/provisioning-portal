<div class="app-filter-bar" role="search" aria-label="Filter orders">
  <app-status-filter
    label="Status"
    [statuses]="statuses"
    [value]="statusFilter() ?? null"
    (valueChange)="setStatus($event)"
  />
  <p class="app-result-count app-numeric" aria-live="polite">
    @if (!orders.isFirstLoad() && !orders.error()) {
      {{ loadedCount() }}
    }
  </p>
</div>

@if (orders.error(); as error) {
  <app-error-state heading="Could not load orders" [error]="error" (retry)="orders.retry()" />
} @else if (orders.isFirstLoad()) {
  <app-table-skeleton label="Loading orders" [columns]="[3, 1.1, 1, 0.9, 1.6, 0.9]" />
} @else if (rows().length === 0) {
  @if (statusFilter()) {
    <app-empty-state
      icon="receipt_long"
      heading="No orders with this status"
      message="Pick another status, or show all orders."
    >
      <button matButton="outlined" type="button" (click)="setStatus(null)">Show all orders</button>
    </app-empty-state>
  } @else {
    <app-empty-state
      icon="receipt_long"
      heading="No orders yet"
      message="Orders add, change or remove users. Each one is validated, then provisioned line by line."
    >
      <a matButton="filled" [routerLink]="['/accounts', store.accountId(), 'orders', 'new']">
        <mat-icon svgIcon="add" />
        New order
      </a>
    </app-empty-state>
  }
} @else {
  <app-orders-table [orders]="rows()" />
}

@if (orders.hasMore() || orders.loadMoreError()) {
  <app-load-more
    noun="orders"
    [shown]="orders.items().length"
    [hasMore]="orders.hasMore()"
    [loading]="orders.isLoadingMore()"
    [error]="orders.loadMoreError()"
    (loadMore)="orders.loadMore()"
    (retry)="orders.retry()"
  />
}
